# Tweak catalog. Ported tweaks are pure data: a list of steps from the closed set in
# docs/ARCHITECTURE.md ("Step ops"). No tweak carries its own shell.
#
# Upstream paths (`upstream`) point into MZD-AIO-TI 2.8.6 at commit 409c724 and are
# guidance only: `git show 409c724:<path>`.
#
# Step fields: op, path, and per op:
#   require_file      -
#   require_literal   literal, count (exact line count; omit for "at least one"),
#                     applied (literal meaning "already done"), hint
#   require_backup    -
#   backup            -
#   append_block      block, asset (under assets/)
#   remove_block      block
#   replace_literal   find, replace
#   install_file      option (a file-typed option)
#   restore           -
#   exec              argv (path is argv[0])
# Optional on any step: when = "<bool option>" or unless = "<bool option>".

# ---------------------------------------------------------------- prerequisites

[[tweak]]
id = "sm-watchdog-off"
status = "ported"
title = "Disable sm.conf watchdogs (prerequisite)"
summary = "Turn off system-manager watchdogs so a broken GUI patch hangs (recoverable) instead of reboot-looping."
risk = "medium"
prerequisite = true
permanent = true
requires = []
compat = [{ profile = "v70-00x", evidence = "upstream" }, { profile = "v59-5xx", evidence = "upstream" }]
upstream = ["app/files/tweaks/00_start.txt"]
notes = ["Added automatically for tweaks that patch GUI JavaScript.", "Never reverted (rule S02)."]

[[tweak.install]]
op = "require_literal"
path = "/jci/sm/sm.conf"
literal = 'watchdog_enable="true"'
applied = 'watchdog_enable="false"'

[[tweak.install]]
op = "require_literal"
path = "/jci/sm/sm.conf"
literal = 'args="-u /jci/gui/index.html"'
applied = 'args="-u /jci/gui/index.html --noWatchdogs"'

[[tweak.install]]
op = "backup"
path = "/jci/sm/sm.conf"

[[tweak.install]]
op = "replace_literal"
path = "/jci/sm/sm.conf"
find = 'watchdog_enable="true"'
replace = 'watchdog_enable="false"'

[[tweak.install]]
op = "replace_literal"
path = "/jci/sm/sm.conf"
find = 'args="-u /jci/gui/index.html"'
replace = 'args="-u /jci/gui/index.html --noWatchdogs"'

# ---------------------------------------------------------------- ported

[[tweak]]
id = "no-disclaimer"
status = "ported"
title = "No more disclaimer"
summary = "Accept the boot disclaimer automatically."
risk = "low"
requires = ["sm-watchdog-off"]
compat = [{ profile = "v70-00x", evidence = "upstream" }, { profile = "v59-5xx", evidence = "upstream" }]
upstream = [
  "app/files/tweaks/02_disclaimer-i.txt",
  "app/files/tweaks/02_disclaimer-u.txt",
  "app/files/tweaks/config/audio_order_AND_no_More_Disclaimer/",
]
notes = [
  "Upstream replaced systemApp.js with a copy from one firmware build per family; this wraps the stock function instead.",
  "Verify on hardware: the disclaimer should dismiss itself within a second of boot.",
]

[[tweak.install]]
op = "require_literal"
path = "/jci/gui/apps/system/js/systemApp.js"
literal = "systemApp.prototype._displayedDisclaimer = function"
count = 1
hint = "systemApp.js may have been replaced by legacy MZD-AIO; uninstall that first."

[[tweak.install]]
op = "backup"
path = "/jci/gui/apps/system/js/systemApp.js"

[[tweak.install]]
op = "append_block"
path = "/jci/gui/apps/system/js/systemApp.js"
block = "no-disclaimer"
asset = "patches/no-disclaimer.js"

[[tweak.uninstall]]
op = "require_file"
path = "/jci/gui/apps/system/js/systemApp.js"

[[tweak.uninstall]]
op = "remove_block"
path = "/jci/gui/apps/system/js/systemApp.js"
block = "no-disclaimer"

