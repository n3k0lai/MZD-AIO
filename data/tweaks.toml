[[tweak]]
id = "background"
status = "ported"
title = "Background image"
summary = "Replace the home-screen background with an 800x480 PNG."
risk = "low"
requires = []
compat = [{ profile = "v70-00x", evidence = "upstream" }, { profile = "v59-5xx", evidence = "upstream" }]
upstream = ["app/files/tweaks/00_background.txt"]
notes = ["Prefer a dark image to keep night glare down.", "Uninstall restores the backup taken at install."]

[[tweak.option]]
name = "image"
type = "png"
width = 800
height = 480
description = "Path to the PNG, relative to the config file."

[[tweak.install]]
op = "require_file"
path = "/jci/gui/common/images/background.png"

[[tweak.install]]
op = "backup"
path = "/jci/gui/common/images/background.png"

[[tweak.install]]
op = "install_file"
path = "/jci/gui/common/images/background.png"
option = "image"

[[tweak.uninstall]]
op = "require_backup"
path = "/jci/gui/common/images/background.png"

[[tweak.uninstall]]
op = "restore"
path = "/jci/gui/common/images/background.png"

[[tweak]]
id = "touchscreen-at-speed"
status = "ported"
title = "Touchscreen while moving"
summary = "Keep the touchscreen and speed-locked menus usable while moving."
risk = "medium"
requires = ["sm-watchdog-off"]
acknowledge = "driving-distraction"
acknowledge_why = "Removes Mazda's lockout of touch and menus while moving. Intended for a passenger."
compat = [{ profile = "v70-00x", evidence = "upstream" }, { profile = "v59-5xx", evidence = "upstream" }]
upstream = ["app/files/tweaks/01_touchscreen-i.txt", "app/files/tweaks/01_touchscreen-u.txt"]
notes = [
  "Renames the Global.AtSpeed subscription key, which works on any line layout and reverts exactly.",
  "Also runs Mazda's own speed-restriction scripts, whose state lives outside /jci.",
  "Upstream's DVD-while-driving call is not ported.",
]

[[tweak.option]]
name = "keep_speed_restrict"
type = "bool"
default = false
description = "Keep the stock speed-restriction script enabled (upstream: keeps the cluster compass working)."

[[tweak.install]]
op = "require_literal"
path = "/jci/gui/common/js/Common.js"
literal = '"Global.AtSpeed"'
count = 1
applied = '"Global.AtSpeed_mzdDisabled"'

[[tweak.install]]
op = "backup"
path = "/jci/gui/common/js/Common.js"

[[tweak.install]]
op = "replace_literal"
path = "/jci/gui/common/js/Common.js"
find = '"Global.AtSpeed"'
replace = '"Global.AtSpeed_mzdDisabled"'

[[tweak.install]]
op = "exec"
argv = ["/jci/scripts/set_speed_restriction_config.sh", "disable"]
unless = "keep_speed_restrict"

[[tweak.install]]
op = "exec"
argv = ["/jci/scripts/set_speed_restriction_config.sh", "enable"]
when = "keep_speed_restrict"

[[tweak.install]]
op = "exec"
argv = ["/jci/scripts/set_lvds_speed_restriction_config.sh", "disable"]

[[tweak.uninstall]]
op = "require_literal"
path = "/jci/gui/common/js/Common.js"
literal = '"Global.AtSpeed_mzdDisabled"'
count = 1
applied = '"Global.AtSpeed"'

[[tweak.uninstall]]
op = "replace_literal"
path = "/jci/gui/common/js/Common.js"
find = '"Global.AtSpeed_mzdDisabled"'
replace = '"Global.AtSpeed"'

[[tweak.uninstall]]
op = "exec"
argv = ["/jci/scripts/set_speed_restriction_config.sh", "enable"]

[[tweak.uninstall]]
op = "exec"
argv = ["/jci/scripts/set_lvds_speed_restriction_config.sh", "enable"]

