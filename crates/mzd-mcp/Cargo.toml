[package]
name = "mzd-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
mzd-core = { version = "0.1.0", path = "../mzd-core" }
mzd-transport = { version = "0.1.0", path = "../mzd-transport" }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt", "io-std"] }

[lints]
workspace = true

[features]
serial = ["mzd-transport/serial"]

[[bin]]
name = "mzd-tweaks-mcp"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
